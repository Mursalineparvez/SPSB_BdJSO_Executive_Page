<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executives</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #0C0B12;
  --bg-elev: #16141F;
  --card: linear-gradient(160deg, #17151F 0%, #1D1A28 100%);
  --card-border: rgba(255,255,255,0.09);
  --text: #F7F5F2;
  --muted: #A39DB0;

  /* refined jewel-tone accents */
  --gold: #D9AE55;
  --gold-soft: rgba(217,174,85,0.14);
  --violet: #9C8FD9;
  --violet-soft: rgba(156,143,217,0.14);
  --emerald: #4FBF9F;
  --emerald-soft: rgba(79,191,159,0.14);

  --shadow-sm: 0 4px 14px rgba(0,0,0,0.28);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.45);
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

/* Soft drifting glow blobs, layered behind the particle canvas for depth
   (like the hazy color glow behind the hero text in the reference image). */
body::before, body::after{
  content:"";
  position: fixed;
  z-index: -2;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
}
body::before{
  top: -10%;
  left: -8%;
  width: 50vw;
  height: 50vw;
  background: radial-gradient(circle, rgba(156,143,217,0.20), transparent 70%);
  animation: blobFloatA 26s ease-in-out infinite alternate;
}
body::after{
  bottom: -12%;
  right: -8%;
  width: 55vw;
  height: 55vw;
  background: radial-gradient(circle, rgba(79,191,159,0.16), transparent 70%);
  animation: blobFloatB 30s ease-in-out infinite alternate;
}
@keyframes blobFloatA{
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(6vw, 8vh) scale(1.12); }
}
@keyframes blobFloatB{
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-7vw, -6vh) scale(1.08); }
}
@media (prefers-reduced-motion: reduce){
  body::before, body::after{ animation: none; }
}

/* Interactive particle background — small glowing squares in a mix of
   accent colors that drift and twinkle, and brighten near the cursor.
   Drawn on a fixed canvas behind everything; see #bgCanvas in script.js. */
#bgCanvas{
  position: fixed;
  inset: 0;
  z-index: -1;
  display: block;
  pointer-events: none;
}

.wrap{
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 28px 100px;
  position: relative;
}

/* ---------- Cover banner ---------- */
.cover-banner{
  position: relative;
  height: 380px;
  overflow: hidden;
}
.cover-banner img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  display: block;
}
.cover-banner::after{
  content:"";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(12,11,18,0) 60%, var(--bg) 100%);
}

/* Cover text now sits BELOW the photo, in its own calm section */
.cover-text{
  text-align: center;
  max-width: 640px;
  margin: 0 auto;
  padding: 44px 24px 8px;
}
.cover-eyebrow{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  background: var(--gold-soft);
  border: 1px solid rgba(217,174,85,0.4);
  padding: 7px 18px;
  border-radius: 999px;
  margin: 0 0 20px;
  box-shadow: 0 0 24px rgba(217,174,85,0.18);
}
.cover-title{
  font-family: 'Fraunces', serif;
  font-size: clamp(30px, 4.5vw, 44px);
  font-weight: 600;
  background: linear-gradient(120deg, var(--text) 40%, var(--gold) 70%, var(--text) 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin: 0 0 14px;
  letter-spacing: -0.01em;
  animation: shimmerTitle 8s ease-in-out infinite;
}
@keyframes shimmerTitle{
  0%, 100% { background-position: 0% center; }
  50% { background-position: 100% center; }
}
@media (prefers-reduced-motion: reduce){
  .cover-title{ animation: none; }
}
.cover-subtitle{
  color: var(--muted);
  font-size: 16px;
  line-height: 1.65;
  margin: 0;
}

/* Page header */
.page-head{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 0 40px;
  margin-bottom: 8px;
}
.page-head::after{
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(420px, 70%);
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold) 25%, var(--violet) 50%, var(--emerald) 75%, transparent);
  opacity: 0.7;
}
.year-tabs{
  display: flex;
  gap: 4px;
  background: var(--bg-elev);
  border: 1px solid var(--card-border);
  border-radius: 999px;
  padding: 5px;
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.year-tabs::-webkit-scrollbar{ display: none; }
.year-tab{
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 700;
  background: none;
  border: none;
  color: var(--muted);
  padding: 9px 20px;
  border-radius: 999px;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
}
.year-tab:hover{ color: var(--text); }
.year-tab.active{
  background: linear-gradient(120deg, var(--gold), #B8863E);
  color: #201404;
  box-shadow: 0 4px 16px rgba(217,174,85,0.35);
  animation: tabPulse 3s ease-in-out infinite;
}
@keyframes tabPulse{
  0%, 100% { box-shadow: 0 4px 16px rgba(217,174,85,0.35); }
  50% { box-shadow: 0 4px 24px rgba(217,174,85,0.55); }
}
@media (prefers-reduced-motion: reduce){
  .year-tab.active{ animation: none; }
}

/* Section heading */
.section-heading{
  display:flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 26px;
}
.section-heading .icon-chip{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  flex-shrink: 0;
}
.section-heading svg{ width: 22px; height: 22px; flex-shrink: 0; }
.section-heading h2{
  font-family: 'Fraunces', serif;
  font-size: 23px;
  font-weight: 600;
  margin: 0;
  color: var(--text);
}
.section-heading .count{
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  background: var(--bg-elev);
  border: 1px solid var(--card-border);
  padding: 3px 10px;
  border-radius: 999px;
}
.section-heading .rule{
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--card-border), transparent);
}
section.group{ margin-bottom: 56px; }
section.group.fade-in{ animation: fadeUp 0.45s ease both; }

/* group accent colors */
.section-heading.coordinators .icon-chip{ background: var(--gold-soft); border: 1px solid rgba(217,174,85,0.3); }
.section-heading.team_leader .icon-chip{ background: var(--violet-soft); border: 1px solid rgba(156,143,217,0.3); }
.section-heading.volunteers .icon-chip{ background: var(--emerald-soft); border: 1px solid rgba(79,191,159,0.3); }
.section-heading.coordinators svg{ color: var(--gold); }
.section-heading.team_leader svg{ color: var(--violet); }
.section-heading.volunteers svg{ color: var(--emerald); }

.card[data-group="coordinators"] .card-name-row svg{ color: var(--gold); }
.card[data-group="team_leader"] .card-name-row svg{ color: var(--violet); }
.card[data-group="volunteers"] .card-name-row svg{ color: var(--emerald); }

.card[data-group="coordinators"]::before{ background: linear-gradient(90deg, var(--gold), transparent); }
.card[data-group="team_leader"]::before{ background: linear-gradient(90deg, var(--violet), transparent); }
.card[data-group="volunteers"]::before{ background: linear-gradient(90deg, var(--emerald), transparent); }

.card[data-group="coordinators"]:hover{ border-color: rgba(217,174,85,0.6); box-shadow: 0 16px 40px rgba(217,174,85,0.18), 0 0 0 1px rgba(217,174,85,0.25); }
.card[data-group="team_leader"]:hover{ border-color: rgba(156,143,217,0.6); box-shadow: 0 16px 40px rgba(156,143,217,0.18), 0 0 0 1px rgba(156,143,217,0.25); }
.card[data-group="volunteers"]:hover{ border-color: rgba(79,191,159,0.6); box-shadow: 0 16px 40px rgba(79,191,159,0.18), 0 0 0 1px rgba(79,191,159,0.25); }

.card[data-group="coordinators"] .card-role{ color: var(--gold); background: var(--gold-soft); border: 1px solid rgba(217,174,85,0.25); }
.card[data-group="team_leader"] .card-role{ color: var(--violet); background: var(--violet-soft); border: 1px solid rgba(156,143,217,0.25); }
.card[data-group="volunteers"] .card-role{ color: var(--emerald); background: var(--emerald-soft); border: 1px solid rgba(79,191,159,0.25); }

/* Grid — coordinators/team leader get bigger, richer cards; volunteers stay compact */
.grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.grid.grid-compact{
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

/* Card */
.card{
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  background: var(--card);
  backdrop-filter: blur(10px);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, border-color 0.25s ease;
  animation: fadeUp 0.45s ease both;
}
.card::before{
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  opacity: 0.85;
}
.card::after{
  content: "";
  position: absolute;
  top: -40%; left: -20%;
  width: 60%; height: 140%;
  background: linear-gradient(115deg, rgba(255,255,255,0.06), transparent 60%);
  pointer-events: none;
  transform: skewX(-12deg);
}
.card:hover, .card:focus-visible{
  transform: translateY(-6px) scale(1.015);
  outline: none;
}

.card-info{
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  flex: 1;
}
.card-name-row{
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
.card-name-row svg{ width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
.card-name{
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.card-name-row{ min-width: 0; }
.card-role{
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 3px 9px;
  border-radius: 999px;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: fit-content;
}

.card[data-group="coordinators"] .card-photo::after{ box-shadow: inset 4px 0 24px -6px rgba(217,174,85,0.5); }
.card[data-group="team_leader"] .card-photo::after{ box-shadow: inset 4px 0 24px -6px rgba(156,143,217,0.5); }
.card[data-group="volunteers"] .card-photo::after{ box-shadow: inset 4px 0 24px -6px rgba(79,191,159,0.5); }

.card-photo{
  flex-shrink: 0;
  width: 126px;
  align-self: stretch;
  position: relative;
}
.card-photo::after{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(90deg, rgba(23,21,42,0.35), transparent 40%);
}
.card-photo img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}
.card:hover .card-photo img{ transform: scale(1.06); }

/* Compact volunteer cards: smaller photo, tighter padding, name still fully visible */
.grid-compact .card-photo{ width: 84px; }
.grid-compact .card-info{ padding: 14px 12px; }
.grid-compact .card-name{ font-size: 13.5px; }
.grid-compact .card-role{ font-size: 10px; padding: 2px 8px; }

@keyframes fadeUp{
  from{ opacity: 0; transform: translateY(8px); }
  to{ opacity: 1; transform: translateY(0); }
}

/* ---------- Modal ---------- */
.modal-overlay{
  position: fixed; inset: 0;
  background: rgba(6,5,10,0.78);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.open{ opacity: 1; pointer-events: auto; }

.modal{
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  max-width: 440px;
  width: 100%;
  max-height: 84vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(14px) scale(0.98);
  transition: transform 0.2s ease;
}
.modal-overlay.open .modal{ transform: translateY(0) scale(1); }

.modal-head{
  padding: 32px 28px 22px;
  text-align: center;
  position: relative;
  border-bottom: 1px solid var(--card-border);
  background: radial-gradient(ellipse 300px 140px at 50% 0%, rgba(217,174,85,0.12), transparent 70%);
}
.modal-close{
  position: absolute;
  top: 14px; right: 14px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--card-border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  display:flex; align-items:center; justify-content:center;
}
.modal-close:hover{ background: rgba(255,255,255,0.1); }

.modal-head img{
  width: 88px; height: 88px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--bg);
  margin-bottom: 14px;
  position: relative;
  z-index: 1;
}
.modal-avatar-ring{
  width: 96px; height: 96px;
  margin: 0 auto 14px;
  border-radius: 50%;
  padding: 4px;
  background: conic-gradient(from 0deg, var(--gold), var(--violet), var(--emerald), var(--gold));
  animation: ringSpin 6s linear infinite;
}
.modal-avatar-ring img{ margin-bottom: 0; }
@keyframes ringSpin{
  to{ transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce){
  .modal-avatar-ring{ animation: none; }
}
.modal-head h3{
  font-family: 'Fraunces', serif;
  font-size: 19px;
  font-weight: 600;
  margin: 0 0 6px;
}
.modal-head .current-role{
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--gold);
  margin: 0;
}
.modal-head .modal-phone{
  font-family: 'Manrope', sans-serif;
  font-size: 12.5px;
  color: var(--muted);
  margin: 8px 0 0;
}
.modal-head .modal-institution{
  font-family: 'Manrope', sans-serif;
  font-size: 12.5px;
  color: var(--muted);
  margin: 4px 0 0;
}

.modal-body{ padding: 24px 28px 30px; }
.modal-body h4{
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 18px;
}

.timeline{ position: relative; padding-left: 20px; }
.timeline::before{
  content:"";
  position:absolute; left: 4px; top: 4px; bottom: 4px;
  width: 2px;
  background: linear-gradient(180deg, var(--gold), var(--violet), var(--emerald));
  opacity: 0.4;
}
.t-item{ position: relative; padding-bottom: 18px; }
.t-item:last-child{ padding-bottom: 0; }
.t-item::before{
  content:"";
  position:absolute; left: -20px; top: 3px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--gold);
}
.t-item.current::before{ background: var(--gold); }
.t-year{ font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 700; color: var(--text); margin: 0 0 2px; }
.t-role{ font-family: 'Fraunces', serif; font-size: 14px; color: var(--text); margin: 0 0 2px; }
.t-group{ font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.04em; }

@media (max-width: 900px){
  .grid{ grid-template-columns: repeat(2, 1fr); }
  .grid.grid-compact{ grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px){
  .wrap{ padding: 0 18px 64px; }
  .grid{ grid-template-columns: 1fr; gap: 14px; }
  .grid.grid-compact{ grid-template-columns: 1fr; gap: 12px; }
  .page-head{ padding: 20px 0 32px; }
  .year-tabs{ width: 100%; }
  .card-photo{ width: 96px; }
  .card-info{ padding: 16px 14px; }
  .modal-head{ padding: 26px 20px 18px; }
  .modal-body{ padding: 20px 20px 26px; }
}
@media (max-width: 380px){
  .card{ flex-direction: row; }
  .card-photo{ width: 80px; }
  .card-name{ font-size: 14px; }
  .card-role{ font-size: 10px; }
  .grid-compact .card-photo{ width: 64px; }
  .modal{ max-width: 100%; }
  .modal-head img{ width: 72px; height: 72px; }
}
@media (prefers-reduced-motion: reduce){
  .card, .year-tab, .modal, .modal-overlay{ transition: none; animation: none; }
}

</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- Cover banner photo. To swap it later, just replace this src with a

<script>
/* ---------------------------------------------------------------
   3D depth-field background — particles sit at random depths (z)
   between "far" and "near". Nearer particles are bigger, brighter,
   sharper, and shift further when the cursor moves (parallax) —
   the classic trick that reads as real depth rather than a flat
   2D scatter. Farther particles get a soft blur, like a shallow
   camera depth-of-field. Runs independently of the rest of the
   page's data/rendering.
----------------------------------------------------------------*/
(function initParticleBackground(){
  const canvas = document.getElementById('bgCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');

  let width, height, dpr;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const PARTICLE_COUNT = Math.min(160, Math.floor((window.innerWidth * window.innerHeight) / 9000));
  const PALETTE = ['217,174,85', '156,143,217', '79,191,159']; // gold, violet, emerald
  const particles = [];
  for(let i = 0; i < PARTICLE_COUNT; i++){
    const z = Math.random(); // 0 = far away, 1 = right up close
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      z,
      size: (Math.random() * 1.4 + 0.6) * (0.5 + z * 1.6),
      baseAlpha: (Math.random() * 0.35 + 0.1) * (0.4 + z * 0.9),
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.5 + 0.2,
      drift: (Math.random() - 0.5) * 0.05 * (0.4 + z),
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)]
    });
  }
  particles.sort((a, b) => a.z - b.z); // draw far-to-near so near ones layer on top

  let mouseX = -9999, mouseY = -9999;
  let parallaxX = 0, parallaxY = 0; // smoothed camera offset
  window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
  window.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });
  window.addEventListener('touchmove', e => {
    if(e.touches && e.touches[0]){ mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }
  }, { passive: true });

  const REACT_RADIUS = 130;
  const LINK_RADIUS = 100;
  const PARALLAX_STRENGTH = 26; // px of max shift for the nearest particles
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(time){
    ctx.clearRect(0, 0, width, height);

    // Camera drifts toward the cursor's offset from center; smoothed so it
    // glides rather than snaps — this is what sells the 3D parallax.
    const targetX = mouseX > -1000 ? (mouseX - width / 2) / (width / 2) : 0;
    const targetY = mouseY > -1000 ? (mouseY - height / 2) / (height / 2) : 0;
    parallaxX += (targetX - parallaxX) * 0.04;
    parallaxY += (targetY - parallaxY) * 0.04;

    particles.forEach(p => {
      if(!reduceMotion){
        p.y += p.drift;
        if(p.y < -10) p.y = height + 10;
        if(p.y > height + 10) p.y = -10;
      }

      // Nearer particles (higher z) shift more with the parallax camera —
      // this depth-dependent offset is the core of the 3D effect.
      p._drawX = p.x + parallaxX * PARALLAX_STRENGTH * p.z;
      p._drawY = p.y + parallaxY * PARALLAX_STRENGTH * p.z;

      const twinkle = reduceMotion ? 1 : Math.sin(time * 0.001 * p.speed + p.phase) * 0.3 + 0.7;
      let alpha = p.baseAlpha * twinkle;

      const dx = p._drawX - mouseX;
      const dy = p._drawY - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if(dist < REACT_RADIUS){
        const boost = 1 - dist / REACT_RADIUS;
        alpha = Math.min(1, alpha + boost * 0.85 * (0.5 + p.z * 0.5));
      }
      p._alpha = alpha;
    });

    // Constellation lines only between particles at similar depth — keeps
    // the web from flattening the 3D read by linking near-to-far.
    for(let i = 0; i < particles.length; i++){
      const a = particles[i];
      for(let j = i + 1; j < particles.length; j++){
        const b = particles[j];
        if(Math.abs(a.z - b.z) > 0.35) continue;
        const dx = a._drawX - b._drawX, dy = a._drawY - b._drawY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < LINK_RADIUS){
          const midX = (a._drawX + b._drawX) / 2, midY = (a._drawY + b._drawY) / 2;
          const mdx = midX - mouseX, mdy = midY - mouseY;
          const mouseDist = Math.sqrt(mdx * mdx + mdy * mdy);
          const cursorBoost = mouseDist < REACT_RADIUS ? (1 - mouseDist / REACT_RADIUS) * 0.5 : 0;
          const depthFade = (a.z + b.z) / 2;
          const lineAlpha = ((1 - dist / LINK_RADIUS) * 0.12 + cursorBoost) * (0.3 + depthFade * 0.7);
          ctx.strokeStyle = `rgba(${a.color}, ${lineAlpha.toFixed(3)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a._drawX, a._drawY);
          ctx.lineTo(b._drawX, b._drawY);
          ctx.stroke();
        }
      }
    }

    particles.forEach(p => {
      const dx = p._drawX - mouseX, dy = p._drawY - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const size = dist < REACT_RADIUS ? p.size + (1 - dist / REACT_RADIUS) * 3 : p.size;

      // real camera focused on the nearer layer.

      ctx.fillRect(p._drawX - size / 2, p._drawY - size / 2, size, size);
    });
    ctx.filter = 'none';

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

    const r = role.toLowerCase();
    if(r.includes('coordinator')) return ICONS.compass;
    if(r.includes('team leader')) return ICONS.star;
    if(r.includes('volunteer')) return ICONS.heart;
    if(r.includes('moderator')) return ICONS.cap;
    if(r.includes('president')) return ICONS.crown;
    if(r.includes('secretary')) return ICONS.people;
    if(r.includes('treasurer')) return ICONS.wallet;
    return ICONS.star;
  }

  function sortedHistory(p){
    return [...p.history].sort((a,b) => b.year - a.year);
  }

  function card(p, entryForYear, indexInSection){
    const delay = Math.min(indexInSection * 35, 420);
    return `
      <div class="card" data-id="${p.id}" data-group="${entryForYear.group}" style="animation-delay:${delay}ms" tabindex="0" role="button" aria-haspopup="dialog">
        <div class="card-info">
          <div class="card-name-row">${iconFor(entryForYear.role)}<span class="card-name">${p.name}</span></div>
          <p class="card-role">${entryForYear.role}</p>
        </div>
        <div class="card-photo"><img src="${p.photo}" alt="${p.name}"></div>
      </div>`;
  }

  function renderYear(year){
    year = Number(year);
    const content = document.getElementById('content');
    let html = "";

    GROUP_ORDER.forEach(group => {
      const members = PEOPLE
        .map(p => ({ p, entry: p.history.find(h => h.year === year && h.group === group) }))
        .filter(x => x.entry);

      if(members.length){
        const gridClass = group === 'volunteers' ? 'grid grid-compact' : 'grid';
        html += `
          <section class="group fade-in">
            <div class="section-heading ${group}">${ICONS[GROUP_ICON[group]]}<h2>${GROUP_LABELS[group]}</h2><span class="count">${members.length}</span><div class="rule"></div></div>
            <div class="${gridClass}">
              ${members.map(({p, entry}, i) => card(p, entry, i)).join("")}
            </div>
          </section>`;
      }
    });

    content.innerHTML = html || `<p style="color:var(--muted);">No records for ${year}.</p>`;

    content.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => openModal(el.dataset.id));
      el.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(el.dataset.id); }
      });
    });
  }

  function renderTabs(){
    const years = [];
    for(let y = YEAR_RANGE.end; y >= YEAR_RANGE.start; y--) years.push(y);
    const tabWrap = document.getElementById('yearTabs');
    tabWrap.innerHTML = years.map((y, i) =>
      `<button class="year-tab${i===0 ? ' active' : ''}" data-year="${y}">${y}</button>`
    ).join("");

    tabWrap.querySelectorAll('.year-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        tabWrap.querySelectorAll('.year-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderYear(btn.dataset.year);
      });
    });

    renderYear(years[0]);
  }

  function openModal(id){
    const overlay = document.getElementById('modalOverlay');
    const p = PEOPLE.find(x => x.id === id);
    if(!p || !overlay) return;
    const hist = sortedHistory(p);

    document.getElementById('modalAvatar').src = p.photo;
    document.getElementById('modalAvatar').alt = p.name;
    document.getElementById('modalName').textContent = p.name;
    document.getElementById('modalCurrentRole').textContent = `${hist[0].role} · ${hist[0].year}`;

    const instEl = document.getElementById('modalInstitution');
    instEl.textContent = p.institution ? `🎓 ${p.institution}` : "";
    instEl.style.display = p.institution ? "block" : "none";

    const phoneEl = document.getElementById('modalPhone');
    phoneEl.textContent = p.phone ? `📞 ${p.phone}` : "";
    phoneEl.style.display = p.phone ? "block" : "none";

    const yearsWorked = hist.length;
    document.querySelector('.modal-body h4').textContent =
      `Full history — ${yearsWorked} year${yearsWorked > 1 ? 's' : ''}`;

    document.getElementById('modalTimeline').innerHTML = hist.map((h, i) => `
      <div class="t-item${i===0 ? ' current' : ''}">
        <p class="t-year">${h.year}</p>
        <p class="t-role">${h.role}</p>
        <p class="t-group">${GROUP_LABELS[h.group]}</p>
      </div>
    `).join("");

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    const overlay = document.getElementById('modalOverlay');
    if(!overlay) return;
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  // Runs setup once the page's HTML actually exists — protects against
  // tools that insert this script before the HTML tab's markup loads.
  function init(){
    const overlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    if(!overlay || !modalClose || !document.getElementById('yearTabs')){
      // HTML not in the DOM yet — try again shortly instead of failing silently.
      setTimeout(init, 50);
      return;
    }
    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
    renderTabs();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

</script>

</body>
</html>
